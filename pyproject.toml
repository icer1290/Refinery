[project]
name = "refinery"
version = "1.0.0"
description = "AI-powered tech news aggregation service with LangGraph - CLI-first design for agent integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Refinery Team"}
]
maintainers = [
    {name = "Refinery Team"}
]
keywords = [
    "ai",
    "news-aggregation",
    "langgraph",
    "langchain",
    "rag",
    "graphrag",
    "cli",
    "rss",
    "llm",
    "vector-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # LangGraph and LangChain
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langsmith>=0.1.0",
    "langchain-text-splitters>=1.1.1",
    # Database
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.14",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "alembic>=1.13.0",
    # RSS and Web Scraping
    "feedparser>=6.0.10",
    "trafilatura>=1.6.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=8.1.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "python-dateutil>=2.8.0",
    # GraphRAG (community detection)
    "igraph>=0.11.0",
    "leidenalg>=0.10.0",
    # Cache
    "redis>=5.0.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/icer1290/Refinery"
Documentation = "https://github.com/icer1290/Refinery#readme"
Repository = "https://github.com/icer1290/Refinery.git"
Issues = "https://github.com/icer1290/Refinery/issues"
Changelog = "https://github.com/icer1290/Refinery/releases"

[project.scripts]
refinery = "app.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "app/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true