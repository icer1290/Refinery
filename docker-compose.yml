services:
  # ⚠️ SECURITY WARNING: Change default credentials before production deployment!
  # The hardcoded 'postgres/postgres' credentials are for local development only.
  # Set POSTGRES_USER, POSTGRES_PASSWORD, and POSTGRES_DB via environment variables
  # or a .env file for production use.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-engine-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: news_aggregator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-engine:
    build: .
    container_name: ai-engine
    environment:
      FORCE_COLOR: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/news_aggregator
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-v4}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-qwen3.5-35b-a3b}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-default}
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: